name: Build ThinkNode M9

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install platformio esptool

      - name: Build ThinkNode M9 Firmware (.bin)
        run: |
          pio run -e thinknode-m9

      - name: Create Monolithic 16MB Factory Binary
        run: |
          esptool.py --chip esp32s3 merge_bin -o M5Launcher_ThinkNode_M9_FACTORY_16MB.bin \
            --flash_mode qio --flash_freq 80m --flash_size 16MB \
            0x0000 .pio/build/thinknode-m9/bootloader.bin \
            0x8000 .pio/build/thinknode-m9/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 .pio/build/thinknode-m9/firmware.bin

      - name: Upload Real Compiled Binaries as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: M5Launcher-ThinkNode-M9-Real-Binaries
          path: |
            .pio/build/thinknode-m9/firmware.bin
            M5Launcher_ThinkNode_M9_FACTORY_16MB.bin
